name: Feature idea
description: Suggest a new animal, mission, lens or anything else
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to see in Wild Lens?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
